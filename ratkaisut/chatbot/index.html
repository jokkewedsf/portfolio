        <h1 lang="fi">Tekoäly-Joakim</h1>
        <p lang="fi">Chat vastaa Joakimista hänen kokoamastaan tietopohjasta. Selain lähettää viestin Cloudflare Workeriin, joka kysyy xAI:n Grok-mallilta. Avain ja tietopohja pysyvät palvelimella. Kokeilu tarvitsee JavaScriptin.</p>
        <h1 lang="en">AI Joakim</h1>
        <p lang="en">The chat answers about Joakim from the knowledge base he maintains. The browser sends the message to a Cloudflare Worker, which asks xAI's Grok model. The key and the knowledge base stay on the server. Trying it needs JavaScript.</p>
