name = "joakim-ai"
main = "worker.js"
compatibility_date = "2026-11-11"

# Julkiset asetukset. Avain ja järjestelmäkehote ovat salaisuuksia, ei näitä.
[vars]
API_BASE = "https://api.x.ai/v1"
MODEL = "grok-4.20-0309-non-reasoning"
# Jätä tyhjäksi. grok-4.7 kesti 15–25 s ja ehti aikarajaan.
REASONING = ""

# Luo nimiavaruus ja korvaa id sen tulosteella:
# npx wrangler kv namespace create RAJA
[[kv_namespaces]]
binding = "RAJA"
id = "bf9b0a0e2ea342e28c3503c447b79fc3"
